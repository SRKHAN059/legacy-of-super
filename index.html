<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101018" />
    <title>Legacy of Super</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* Save-code panel (title > file > Export / Import Code), drawn like the game's windows. */
      #code-panel {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        background: rgba(4, 6, 16, 0.78);
        touch-action: auto;
      }
      #code-panel[hidden] { display: none; }
      #code-form {
        width: min(560px, 100%);
        max-height: 100%;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px 18px;
        border: 2px solid #c8d0f0;
        border-radius: 4px;
        background: #101c40;
        box-shadow: inset 0 0 0 2px #6878b0, 0 0 0 1px #000, 0 10px 40px rgba(0, 0, 0, 0.6);
        color: #f8f8f8;
        font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace;
      }
      #code-title { margin: 0; font-size: 16px; color: #f8d030; letter-spacing: 0.04em; }
      #code-help { margin: 0; color: #c8d0f0; }
      #code-text {
        width: 100%;
        min-height: 120px;
        resize: vertical;
        padding: 8px;
        border: 1px solid #6878b0;
        border-radius: 3px;
        background: #081028;
        color: #f8f8f8;
        /* 16px keeps iOS from zooming the page when the box gets focus. */
        font: 16px/1.35 ui-monospace, Menlo, Consolas, monospace;
        word-break: break-all;
        overflow-wrap: anywhere;
        -webkit-user-select: text;
        user-select: text;
        touch-action: auto;
      }
      #code-text:focus, .code-actions button:focus-visible { outline: 2px solid #f8d030; outline-offset: 1px; }
      #code-status { margin: 0; min-height: 1.4em; color: #60e060; }
      #code-status.error { color: #f86060; }
      .code-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
      .code-actions button {
        min-width: 96px;
        min-height: 40px;
        padding: 6px 14px;
        border: 1px solid #c8d0f0;
        border-radius: 4px;
        background: #28385c;
        color: #f8f8f8;
        font: 700 14px ui-monospace, Menlo, Consolas, monospace;
        cursor: pointer;
        touch-action: manipulation;
      }
      .code-actions button:hover { background: #34487a; }
      .code-actions button.primary { border-color: #f8d030; background: #7a5c10; }
      .code-actions button[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="screen-wrap">
        <canvas id="screen" width="240" height="160" aria-label="Game screen"></canvas>
      </div>
      <div id="touch" aria-hidden="true">
        <div class="cluster left">
          <button class="shoulder" data-btn="L">L</button>
          <div class="dpad">
            <button data-btn="up" class="d up"></button>
            <button data-btn="left" class="d left"></button>
            <button data-btn="right" class="d right"></button>
            <button data-btn="down" class="d down"></button>
            <span class="d mid"></span>
          </div>
          <button class="small" data-btn="select">SELECT</button>
        </div>
        <div class="cluster right">
          <button class="shoulder" data-btn="R">R</button>
          <div class="ab">
            <button data-btn="B" class="face b">B</button>
            <button data-btn="A" class="face a">A</button>
          </div>
          <button class="small" data-btn="start">START</button>
        </div>
      </div>
    </div>
    <div id="code-panel" hidden>
      <form id="code-form" role="dialog" aria-modal="true" aria-labelledby="code-title" aria-describedby="code-help" novalidate>
        <h2 id="code-title">Save code</h2>
        <p id="code-help"></p>
        <textarea id="code-text" rows="6" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Save code"></textarea>
        <p id="code-status" role="status" aria-live="polite"></p>
        <div class="code-actions">
          <button type="button" id="code-copy">Copy</button>
          <button type="submit" id="code-ok" class="primary">Import</button>
          <button type="button" id="code-close">Close</button>
        </div>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
